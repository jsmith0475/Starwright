name: I would like to volunteer
description: Say hello and tell us how you would like to help
labels: [volunteer]
body:
  - type: markdown
    attributes:
      value: Welcome, and thank you. You do not need to be a programmer to help.
  - type: checkboxes
    id: areas
    attributes:
      label: What would you like to help with?
      options:
        - label: Play-testing and bug reports
        - label: Testing on Windows, Linux, Safari or Firefox
        - label: Physics, orbital mechanics or aerodynamics
        - label: Programming
        - label: Parts, craft, missions or scenarios
        - label: Art, models or sound
        - label: Writing, documentation or translation
  - type: textarea
    id: about
    attributes:
      label: Anything you would like us to know?
      description: Your background, what drew you to Starwright, or what you would like to do first.
