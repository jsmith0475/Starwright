name: Idea or request
description: A feature, part, mission, scenario, world or improvement you would like to see
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What is the idea?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it make Starwright better?
  - type: checkboxes
    id: help
    attributes:
      label: Would you like to work on it?
      options:
        - label: Yes, I would like to help build this
